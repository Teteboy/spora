name: spora_app
description: SPORA - Football Talent Discovery Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # Network
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # Media
  video_player: ^2.9.2
  image_picker: ^1.1.2
  chewie: ^1.8.5

  # Animation
  flutter_animate: ^4.5.0

  # Storage
  shared_preferences: ^2.3.3

  # UI Helpers
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  badges: ^3.1.2
  timeago: ^3.7.0
  intl: ^0.19.0
  percent_indicator: ^4.2.4
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
